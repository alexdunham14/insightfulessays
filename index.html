  <p><a href="feed.xml">Feed</a> · <a href="https://github.com/alexdunham14/insightfulessays/issues/new?template=essay.yml" target="_blank" rel="noopener">suggest an essay</a> · <a href="https://github.com/alexdunham14/insightfulessays" target="_blank" rel="noopener">source</a></p>
</footer>
